name: validate

on:
  pull_request:
    paths:
      - 'data/**'
      - 'media/**'
      - 'packages/schema/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate data
        run: pnpm validate --online
