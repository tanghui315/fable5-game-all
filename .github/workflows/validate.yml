name: validate

on:
  pull_request:
    paths:
      - 'data/**'
      - 'media/**'
      - 'packages/schema/**'
      - '.github/workflows/validate.yml'
  # Fallback when a bot-created PR did not trigger `pull_request`:
  # Actions -> validate -> Run workflow, ref = refs/pull/<N>/merge or the branch.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to validate (e.g. refs/pull/42/merge or candidate/owner--repo)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate data
        run: pnpm validate --online
