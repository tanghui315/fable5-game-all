name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'media/**'
      - 'apps/site/**'
      - 'packages/schema/**'
      # A workflow edit can break the build or the deploy step itself; redeploy
      # so that change is exercised instead of waiting for the next data push.
      - '.github/workflows/**'
  workflow_dispatch:
  # Bot pushes use GITHUB_TOKEN, which does not trigger `push` workflows.
  # Re-deploy after the data-writing workflows finish on main instead.
  workflow_run:
    workflows: [healthcheck, discover, submission]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: build and deploy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build schema
        run: pnpm --filter @fable5/schema build

      - name: Build site
        run: pnpm --filter site build

      # A missing token used to make this job pass while deploying nothing, so
      # the site silently fell behind main. Fail loudly instead.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Deploy is not configured::Add repository secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID. The build succeeded but nothing was published."
            exit 1
          fi

      # `pnpm dlx` keeps Wrangler out of the workspace: the action's own
      # installer runs `pnpm add wrangler` at the root, which pnpm refuses.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'fable5-game-all' }}
        run: |
          pnpm dlx wrangler@4 pages deploy apps/site/dist \
            --project-name="$CF_PAGES_PROJECT" \
            --branch=main
