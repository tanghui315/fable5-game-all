name: discover

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    name: search and enrich candidates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build schema
        run: pnpm --filter @fable5/schema build

      - name: Install Playwright chromium
        run: pnpm --filter crawler exec playwright install --with-deps chromium

      - name: Search and open candidate PRs
        env:
          # Fine-grained read-only PAT keeps code search in its own quota.
          GITHUB_TOKEN: ${{ secrets.GH_SEARCH_TOKEN || github.token }}
          # Branch/PR writes use BOT_TOKEN so `pull_request` workflows (validate) run.
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm --filter crawler crawler discover --limit 10

      # The home hero tops up with the newest entries that have a preview, so
      # recording previews here is what keeps the carousel moving on its own.
      - name: Backfill missing previews
        continue-on-error: true
        run: pnpm --filter crawler crawler preview --kind all --limit 6

      - name: Commit crawler state and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_state/seen.json data/games media
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: update crawler state and previews"
          for attempt in 1 2; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            echo "::warning::push failed (attempt $attempt); rebasing and retrying"
            sleep 5
          done
          echo "::error::failed to push after 2 attempts"
          exit 1
