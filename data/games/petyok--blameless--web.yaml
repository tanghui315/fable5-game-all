  zh: 凌晨 3:07，告警响了，prod 挂了。你坐在值班席上，一边清僵尸进程一边躲服务器里的东西——错误预算就是血条。Fable 5.2 从一句「你才 1 天大，随便做个游戏」开始，自己定故事、武器、音乐和手感。
  en: At 03:07 the pager goes off and prod is down. You are on call, clearing zombie processes while something hunts you through the racks — and the error budget is your health bar. Fable 5.2 took one open-ended prompt and chose the story, weapons, music and feel itself.
