summary:
  zh: 1986 年霓虹迈阿密的开放世界驾驶。没有游戏引擎，也没有 three.js：作者团队自己写了 WebGL2 渲染器，城市、车辆、车库、雨和引擎声全部由约 6.3 万行 JavaScript 在浏览器里生成，9 MB 的页面里没有外部素材。
  en: "Open-world driving in a neon 1986 Miami. No game engine and no three.js: the team wrote its own WebGL2 renderer, and the city, cars, garage, rain and engine sound are all generated by roughly 63,000 lines of JavaScript. Nine megabytes of page, no external assets."
